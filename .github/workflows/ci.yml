name: build

on:
  push:
    # Tag pushes are handled by release.yml; running both would build the same commit twice.
    tags-ignore:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # The engine drives real rsync: without it the rsync-dependent tests skip themselves, which
      # would silently turn the build into a partial check.
      - name: Install rsync
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync
          rsync --version | head -1

      - name: Build and run tests
        run: mvn -B -ntp verify

      # The tests are headless; this proves the packaged jar itself starts and can copy/verify.
      - name: CLI smoke test against the packaged jar
        run: |
          set -euo pipefail
          jar=$(ls target/file-copy-util-*.jar | head -1)
          java -jar "$jar" --cli --help > /dev/null
          mkdir -p /tmp/smoke/src/sub /tmp/smoke/dst
          echo alpha > /tmp/smoke/src/a.txt
          echo beta > /tmp/smoke/src/sub/b.txt
          java -jar "$jar" --cli --quiet --source /tmp/smoke/src --dest /tmp/smoke/dst --all --csv /tmp/smoke/report.csv
          test -f /tmp/smoke/dst/a.txt && test -f /tmp/smoke/dst/sub/b.txt
          test -s /tmp/smoke/report.csv
          # A dry run must write nothing, and must still report what would be missing (exit 3).
          rm -rf /tmp/smoke/dry && mkdir -p /tmp/smoke/dry
          if java -jar "$jar" --cli --quiet --source /tmp/smoke/src --dest /tmp/smoke/dry --all --dry-run; then
            echo "expected a dry run with missing files to exit non-zero" >&2
            exit 1
          fi
          test -z "$(ls -A /tmp/smoke/dry)"
          java -jar "$jar" --cli --quiet --source /tmp/smoke/src --dest /tmp/smoke/dst --all --verify-only
          echo "alpha changed" > /tmp/smoke/dst/a.txt
          if java -jar "$jar" --cli --quiet --source /tmp/smoke/src --dest /tmp/smoke/dst --all --verify-only; then
            echo "expected a mismatch to exit non-zero" >&2
            exit 1
          fi
