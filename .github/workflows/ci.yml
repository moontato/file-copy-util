name: build

on:
  push:
    # Explicitly include all branches, including names containing '/'. Defining only tags-ignore
    # would disable branch pushes. Tag pushes are handled separately by release.yml.
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

# A newer push to the same branch replaces an in-flight run instead of queueing behind it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The whole check lives in one reusable workflow so that a release cannot pass a different set of
  # checks than a branch did. The called file is the copy at this commit, not the default branch's.
  validate:
    uses: ./.github/workflows/validate.yml
